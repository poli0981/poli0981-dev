pre-commit:
  parallel: true
  commands:
    format:
      glob: "*.{astro,svelte,ts,js,mjs,md,css,json,jsonc,yml,yaml}"
      run: npx prettier --write {staged_files}
      stage_fixed: true
    lint:
      glob: "*.{astro,svelte,ts,js,mjs}"
      run: npx eslint {staged_files}

pre-push:
  commands:
    typecheck:
      run: npm run check
