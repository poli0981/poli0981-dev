version: 2
updates:
  # Root npm project. `/workers/widgets` is omitted on purpose: that worker is
  # dependency-free (no package.json, the YouTube RSS is hand-parsed), so there is no
  # manifest for Dependabot to read. Add an entry the day that worker gains a package.json.
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    # Supply-chain hardening (docs 06 §6): never propose a release younger than three days.
    # Malicious publishes — the Shai-Hulud shape — are usually caught and pulled within hours.
    cooldown:
      default-days: 3
    open-pull-requests-limit: 8
    groups:
      astro:
        patterns: ["astro", "@astrojs/*"]
      # The type-checking toolchain moves together: typescript-eslint pins the TypeScript
      # versions it accepts.
      typescript:
        patterns: ["typescript", "typescript-eslint"]
      dev-tools:
        dependency-type: development
    ignore:
      # `typescript` stays on 6.x on purpose. TypeScript 7.0 ships no JS API, and astro
      # check (Volar), typescript-eslint and svelte2tsx all need one. TS 7 itself is the
      # `@typescript/native` alias (npm:typescript@7) — and Dependabot skips every `npm:`
      # alias, so that one is bumped by hand (docs 17). Lift this ignore once those tools
      # support TypeScript 7.1's new API.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      # prettier-plugin-astro 1.x reflows `<span>{expr}</span>` onto separate lines in 50
      # .astro files, which inserts whitespace text nodes inside inline elements. That is a
      # visual change, not a formatting one — it needs its own PR with a rendered diff.
      - dependency-name: prettier-plugin-astro
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 3
