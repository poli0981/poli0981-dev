name: Báo lỗi website / Website bug report
description: Báo lỗi gặp trên poli0981.dev / Report a problem found on poli0981.dev
title: "[web-report] "
labels: ["bug", "from-site"]
body:
  - type: markdown
    attributes:
      value: |
        Cảm ơn bạn đã báo lỗi. / Thanks for reporting.
        Nhanh hơn: nút "Báo lỗi" ngay trên trang gửi kèm trang và môi trường đang dùng (báo cáo đó đi
        vào một repo riêng, không hiện ở đây). / Quicker: the "Report a problem" button on the page
        itself sends the page and environment along (those reports go to a private repository and
        do not show up here).
        Dự án đang ở chế độ bảo trì: form này dành cho lỗi, không dành cho đề xuất tính năng — xem
        CONTRIBUTING.md. / The project is in maintenance mode: this form is for bugs, not feature
        requests — see CONTRIBUTING.md.
  - type: textarea
    id: description
    attributes:
      label: Mô tả / Description
      description: Chuyện gì đã xảy ra? / What happened?
    validations:
      required: true
  - type: input
    id: route
    attributes:
      label: Trang / Route
      placeholder: "/blog/…"
  - type: textarea
    id: environment
    attributes:
      label: Môi trường / Environment
      description: Trình duyệt, kích thước màn hình, theme, ngôn ngữ / Browser, viewport, theme, locale
  - type: textarea
    id: console
    attributes:
      label: Console log (tùy chọn / optional)
      render: text
