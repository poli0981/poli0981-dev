name: CI

# Docs-only changes skip CI/deploy. NOTE: use `*.md` (root-level) — NOT `**/*.md` —
# because blog/story content lives at src/content/**/*.{md,mdx} and must still deploy.
on:
  pull_request:
    paths-ignore: ["poli0981.dev-docs/**", "*.md", "LICENSE"]
  push:
    branches: [main]
    paths-ignore: ["poli0981.dev-docs/**", "*.md", "LICENSE"]

# Explicit — a missing block makes GitHub default every scope to `none`.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Cancel superseded PR runs; never abort an in-flight main deploy.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      # KV/ASSETS/SESSION types live in the gitignored worker-configuration.d.ts,
      # generated from wrangler.jsonc. `astro check` fails without them — and there
      # is no @cloudflare/workers-types dependency to fall back on. No auth needed.
      - name: Generate Cloudflare binding types
        run: npx wrangler types

      - name: Format check
        run: npx prettier --check .

      - name: Lint
        run: npx eslint .

      - name: Type check
        run: npm run check

      - name: Dead code
        run: npm run knip

      - name: Audit (prod deps, high+)
        run: npm audit --omit=dev --audit-level=high

      - name: Build
        run: npm run build

      # Deploy on push to main only, after every check + the build succeeded.
      # The adapter writes the deploy config to dist/server/wrangler.json (main:
      # entry.mjs, assets: ../client, auto SESSION binding) — verified via dry-run.
      - name: Deploy to Cloudflare
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.112.0"
          command: deploy --config ./dist/server/wrangler.json
