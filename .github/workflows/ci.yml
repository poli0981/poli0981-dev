name: CI

# Docs-only changes skip CI/deploy. NOTE: use `*.md` (root-level) — NOT `**/*.md` —
# because blog/story content lives at src/content/**/*.{md,mdx} and must still deploy.
on:
  pull_request:
    paths-ignore: ["poli0981.dev-docs/**", "*.md", "LICENSE"]
  push:
    branches: [main]
    paths-ignore: ["poli0981.dev-docs/**", "*.md", "LICENSE"]

# Explicit — a missing block makes GitHub default every scope to `none`.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Cancel superseded PR runs; let main runs finish.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # check-exif diffs changed images against the base ref

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      # KV/ASSETS/SESSION types live in the gitignored worker-configuration.d.ts,
      # generated from wrangler.jsonc. `astro check` fails without them — and there
      # is no @cloudflare/workers-types dependency to fall back on. No auth needed.
      - name: Generate Cloudflare binding types
        run: npx wrangler types

      - name: Format check
        run: npx prettier --check .

      - name: Lint
        run: npx eslint .

      - name: Type check
        run: npm run check

      # The cron worker is a separate TS project (own tsconfig + Env types) and is
      # excluded from the root check. Deploy is manual, so typecheck it here as a guard.
      - name: Typecheck widgets worker
        working-directory: workers/widgets
        run: |
          npx wrangler types
          npx tsc -p tsconfig.json --noEmit

      - name: Dead code
        run: npm run knip

      - name: Audit (prod deps, high+)
        run: npm audit --omit=dev --audit-level=high

      # Fail if any changed image under src/assets/ still carries GPS or a camera serial.
      - name: Check EXIF (changed images)
        env:
          DIFF_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node scripts/check-exif.mjs --changed

      - name: Build
        run: npm run build

      # Deployment is handled by Cloudflare Workers Builds (connected to this repo),
      # not GitHub Actions — this workflow is CI gates only (lint/types/knip/audit/build).
      # Workers Builds must deploy with: wrangler deploy --config ./dist/server/wrangler.json
      # (the root wrangler.jsonc has no `main`; the adapter writes the real config there).
