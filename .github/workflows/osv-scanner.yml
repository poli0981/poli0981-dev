name: OSV scan

# docs 06 §6 and 08 §2 both call for a weekly dependency scan; this is it.
# It complements the per-PR `npm audit --omit=dev --audit-level=high` gate in ci.yml:
# audit only sees the production tree and only fails on high+, while OSV covers the
# whole lockfile (devDependencies included) against the full OSV database.
on:
  schedule:
    # Mondays 03:17 UTC — off the hour, where scheduled-runner contention is lowest.
    - cron: "17 3 * * 1"
  workflow_dispatch:
  # Re-run when the dependency graph itself changes, so a bad bump is caught on the PR
  # rather than up to a week later.
  pull_request:
    paths: ["package-lock.json"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The scanner runs directly rather than via google/osv-scanner-action's reusable
      # SARIF workflow: SARIF upload needs `security-events: write` plus code scanning,
      # which is not available on this plan. A non-zero exit failing the run is the
      # alert. Once the repo is public, code scanning becomes free and this can be
      # switched to the reusable workflow for findings in the Security tab.
      - uses: google/osv-scanner-action/osv-scanner-action@6e4298ebc4db23e847df9b2e2de2939d6f066c67 # v2.5.1
        with:
          scan-args: |-
            --lockfile=package-lock.json
