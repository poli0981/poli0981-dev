name: OSV scan

# docs 06 §6 and 08 §2 both call for a weekly dependency scan; this is it.
# It complements the per-PR `npm audit --omit=dev --audit-level=high` gate in ci.yml:
# audit only sees the production tree and only fails on high+, while OSV covers the
# whole lockfile (devDependencies included) against the full OSV database.
on:
  schedule:
    # Mondays 03:17 UTC — off the hour, where scheduled-runner contention is lowest.
    - cron: "17 3 * * 1"
  workflow_dispatch:
  # Re-run when the dependency graph itself changes, so a bad bump is caught on the PR
  # rather than up to a week later…
  pull_request:
    paths: ["package-lock.json"]
  # …and once it lands, so the Security tab reflects main straight away.
  push:
    branches: [main]
    paths: ["package-lock.json"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    # The repo is public, so code scanning is free: findings are uploaded as SARIF and
    # show up under Security → Code scanning, and a finding still fails the run.
    # PR runs skip the upload — Dependabot PRs get a read-only token, so the upload
    # step would fail there for a reason unrelated to the scan itself.
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@a345acffa64b0eaede81a3d9aae6141214d9c8fc # v2.6.0
    permissions:
      actions: read
      contents: read
      security-events: write
    with:
      upload-sarif: ${{ github.event_name != 'pull_request' }}
      scan-args: |-
        --lockfile=package-lock.json
