# SonarCloud analysis, run by the `sonarcloud` job in .github/workflows/ci.yml
# (automatic analysis is switched off — this file is the whole configuration).
sonar.organization=poli0981
sonar.projectKey=poli0981_poli0981-dev
sonar.projectName=poli0981-dev
sonar.sourceEncoding=UTF-8

sonar.sources=src,workers/widgets/src,scripts,public
sonar.tests=tests
sonar.test.inclusions=tests/**/*.test.ts

# Not ours or not code: the content submodule (Markdown), photos, generated declaration
# files and the prebuilt search bundle.
sonar.exclusions=src/content/**,src/assets/**,**/*.d.ts,public/pagefind/**

# Coverage comes from `npm run test:coverage` (node:test + V8 → lcov), uploaded by the
# build job. What it does not measure, and why:
#  - scripts/**  build tooling: it runs in CI as part of the build itself (gen-og,
#                check-csp-hashes, gen-notices) and in the smoke test;
#  - public/**   browser-only scripts (service worker, gate client, offline mini-game);
#  - src/lib/easter.ts  the DOM-only console easter egg;
#  - config files.
# .astro and .svelte files are not analyzed by SonarCloud at all.
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.coverage.exclusions=scripts/**,public/**,src/lib/easter.ts,src/content.config.ts,**/*.config.js,**/*.config.mjs,astro.config.mjs

# The vi/en dictionaries and the link/uses tables are parallel DATA by design (the same
# keys in each locale), not duplicated logic.
sonar.cpd.exclusions=src/i18n/vi.ts,src/i18n/en.ts,src/lib/links.ts,src/lib/uses.ts

# Fail the CI job when the quality gate ("Sonar way") fails.
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300
